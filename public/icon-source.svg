<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bodyGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="65%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#4c1d95" />
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="#0f0f14" />
  <g transform="translate(100 100) scale(0.82) translate(-100 -100)">
    <!-- Ears -->
      <g>
        <ellipse cx="44" cy="56" rx="22" ry="36" fill="#7e22ce" transform="rotate(-30 44 56)" />
        <ellipse cx="44" cy="56" rx="12" ry="24" fill="#f472b6" transform="rotate(-30 44 56)" />
      </g>
      <g>
        <ellipse cx="156" cy="56" rx="22" ry="36" fill="#7e22ce" transform="rotate(30 156 56)" />
        <ellipse cx="156" cy="56" rx="12" ry="24" fill="#f472b6" transform="rotate(30 156 56)" />
      </g>
    
      <!-- Body -->
      <circle cx="100" cy="115" r="72" fill="url(#bodyGrad)" />
    
      <!-- Tummy -->
      <ellipse cx="100" cy="138" rx="42" ry="38" fill="url(#bellyGrad)" opacity="0.9" />
    
      <!-- Feet -->
      <ellipse cx="65" cy="180" rx="18" ry="11" fill="#f59e0b" />
      <ellipse cx="135" cy="180" rx="18" ry="11" fill="#f59e0b" />
    
      <!-- Face mask -->
      <ellipse cx="100" cy="94" rx="52" ry="42" fill="#1e1b4b" />
      <ellipse cx="100" cy="94" rx="49" ry="39" fill="#2e1065" />
    
      <!-- Cheeks -->
      <circle cx="62" cy="106" r="8" fill="#f43f5e" opacity="0.45" />
      <circle cx="138" cy="106" r="8" fill="#f43f5e" opacity="0.45" />
    
      <!-- Eyes -->
      <ellipse cx="78" cy="86" rx="18" ry="20" fill="#ffffff" />
      <ellipse cx="122" cy="86" rx="18" ry="20" fill="#ffffff" />
    
      <ellipse cx="78" cy="87" rx="10" ry="12" fill="#06b6d4" />
      <circle cx="78" cy="87" r="6" fill="#0f172a" />
      <circle cx="74" cy="82" r="3.5" fill="#ffffff" />
      <circle cx="81" cy="90" r="1.8" fill="#ffffff" />
    
      <ellipse cx="122" cy="87" rx="10" ry="12" fill="#06b6d4" />
      <circle cx="122" cy="87" r="6" fill="#0f172a" />
      <circle cx="118" cy="82" r="3.5" fill="#ffffff" />
      <circle cx="125" cy="90" r="1.8" fill="#ffffff" />
    
      <!-- Beak -->
      <path d="M 86 106 Q 100 98 114 106 Q 100 120 86 106 Z" fill="#fb923c" stroke="#ea580c" stroke-width="1.5" />
      <path d="M 89 110 Q 100 118 111 110 Q 100 126 89 110 Z" fill="#f97316" stroke="#c2410c" stroke-width="1.5" />
  </g>
</svg>
